name: Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The tests stub Toga; no Android SDK or native app build is needed.
      - run: python -m pip install microdot requests psutil
      - run: python -m unittest tests.test_smoke tests.test_commands
